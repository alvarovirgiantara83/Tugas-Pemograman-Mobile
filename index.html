<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Todo List (CRUD)</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
      --text-muted: #6b7280;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    h1 {
      text-align: center;
      margin-bottom: 24px;
      color: var(--primary);
    }

    .form-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    button {
      padding: 12px 20px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    .todo-list {
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      margin-bottom: 10px;
      transition: background 0.2s;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .todo-content {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .todo-content input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .todo-text {
      font-size: 16px;
      word-break: break-word;
    }

    .actions {
      display: flex;
      gap: 6px;
    }

    .btn-edit {
      background-color: var(--warning);
    }
    .btn-edit:hover {
      background-color: #d97706;
    }

    .btn-delete {
      background-color: var(--danger);
    }
    .btn-delete:hover {
      background-color: #dc2626;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Todo List</h1>
    
    <!-- Create / Form Tambah Todo -->
    <form id="todo-form" class="form-group">
      <input type="text" id="todo-input" placeholder="Masukkan kegiatan baru..." required autocomplete="off">
      <button type="submit" id="submit-btn">Tambah</button>
    </form>

    <!-- Read / Daftar Todo -->
    <ul id="todo-list" class="todo-list"></ul>
    
    <div id="empty-state" class="empty-state">Belum ada kegiatan. Silakan tambahkan!</div>
  </div>

  <script>
    // State Aplikasi
    let todos = JSON.parse(localStorage.getItem('todos')) || [];
    let editId = null;

    // DOM Elements
    const todoForm = document.getElementById('todo-form');
    const todoInput = document.getElementById('todo-input');
    const submitBtn = document.getElementById('submit-btn');
    const todoList = document.getElementById('todo-list');
    const emptyState = document.getElementById('empty-state');

    // Simpan ke LocalStorage
    function saveTodos() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    // READ: Tampilkan daftar Todo
    function renderTodos() {
      todoList.innerHTML = '';
      
      if (todos.length === 0) {
        emptyState.style.display = 'block';
      } else {
        emptyState.style.display = 'none';
      }

      todos.forEach(todo => {
        const li = document.createElement('li');
        li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
        
        li.innerHTML = `
          <div class="todo-content">
            <input type="checkbox" ${todo.completed ? 'checked' : ''} onchange="toggleComplete(${todo.id})">
            <span class="todo-text">${escapeHtml(todo.text)}</span>
          </div>
          <div class="actions">
            <button class="btn-edit" onclick="startEdit(${todo.id})">Edit</button>
            <button class="btn-delete" onclick="deleteTodo(${todo.id})">Hapus</button>
          </div>
        `;
        
        todoList.appendChild(li);
      });
    }

    // CREATE & UPDATE: Tambah atau Perbarui Todo
    todoForm.addEventListener('submit', function(e) {
      e.preventDefault();
      const text = todoInput.value.trim();
      if (!text) return;

      if (editId !== null) {
        // UPDATE
        todos = todos.map(todo => todo.id === editId ? { ...todo, text } : todo);
        editId = null;
        submitBtn.textContent = 'Tambah';
      } else {
        // CREATE
        const newTodo = {
          id: Date.now(),
          text: text,
          completed: false
        };
        todos.push(newTodo);
      }

      todoInput.value = '';
      saveTodos();
      renderTodos();
    });

    // UPDATE Status (Selesai/Belum)
    function toggleComplete(id) {
      todos = todos.map(todo => {
        if (todo.id === id) {
          return { ...todo, completed: !todo.completed };
        }
        return todo;
      });
      saveTodos();
      renderTodos();
    }

    // Persiapan UPDATE (Isi formulir dengan teks item yang diedit)
    function startEdit(id) {
      const todo = todos.find(t => t.id === id);
      if (todo) {
        todoInput.value = todo.text;
        todoInput.focus();
        editId = id;
        submitBtn.textContent = 'Simpan';
      }
    }

    // DELETE: Hapus Todo
    function deleteTodo(id) {
      todos = todos.filter(todo => todo.id !== id);
      if (editId === id) {
        editId = null;
        todoInput.value = '';
        submitBtn.textContent = 'Tambah';
      }
      saveTodos();
      renderTodos();
    }

    // Keamanan sederhana untuk karakter HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Inisialisasi tampilan awal
    renderTodos();
  </script>
</body>
</html>
